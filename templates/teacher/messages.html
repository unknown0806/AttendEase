{% extends "base.html" %}

{% block title %}Messages — Faculty Portal{% endblock %}

{% block content %}
<div class="row g-3 py-2">
    <!-- Header with Back Button -->
    <div class="col-12">
        <div class="app-top-header">
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('teacher.dashboard') }}" class="text-white fs-4">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <h4 class="fw-bold mb-0 text-white">Department Messages</h4>
            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="app-card">
            <div class="list-group list-group-flush">
                <div class="list-group-item px-0 py-3 border-bottom d-flex align-items-center gap-3">
                    <div class="avatar-circle" style="width: 44px; height: 44px; font-size: 1rem;">P</div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h6 class="fw-bold mb-0 text-dark">Priya Rao (Admin / HOD)</h6>
                            <span class="text-muted small" style="font-size: 0.72rem;">09:15 AM</span>
                        </div>
                        <p class="text-muted small mb-0">Please verify BCA 3A DBMS attendance locks before the evening audit run.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
