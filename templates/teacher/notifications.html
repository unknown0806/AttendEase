{% extends "base.html" %}

{% block title %}Faculty Notifications — Faculty Portal{% endblock %}

{% block content %}
<div class="row g-3 py-2">
    <!-- Header with Back Button -->
    <div class="col-12">
        <div class="app-top-header">
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('teacher.dashboard') }}" class="text-white fs-4">
                    <i class="bi bi-chevron-left"></i>
                </a>
                <h4 class="fw-bold mb-0 text-white">Faculty Notifications</h4>
            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="app-card">
            <div class="list-group list-group-flush small">
                <div class="list-group-item px-0 py-3 border-bottom d-flex align-items-start gap-3">
                    <i class="bi bi-check2-circle fs-4 text-success mt-1"></i>
                    <div>
                        <div class="fw-bold text-dark">Attendance Session Locked</div>
                        <div class="text-muted">BCA 3A Period 1 attendance locked successfully. Tamper protection enabled.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
