<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient for Calendar -->
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Calendar Inner Face Gradient -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Checkmark Badge Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Calendar Outer Body -->
  <rect x="15" y="22" width="90" height="84" rx="22" ry="22" fill="url(#calGrad)" filter="url(#glow)"/>
  
  <!-- Calendar Inner Dark Display -->
  <rect x="22" y="38" width="76" height="61" rx="14" ry="14" fill="url(#faceGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Binder Tabs / Rings -->
  <rect x="33" y="14" width="10" height="18" rx="5" ry="5" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="77" y="14" width="10" height="18" rx="5" ry="5" fill="#818cf8" stroke="#4338ca" stroke-width="1.5"/>

  <!-- Calendar Date Grid Blocks -->
  <!-- Row 1 -->
  <rect x="31" y="48" width="14" height="11" rx="3.5" fill="#60a5fa" fill-opacity="0.35"/>
  <rect x="53" y="48" width="14" height="11" rx="3.5" fill="#60a5fa" fill-opacity="0.35"/>
  <rect x="75" y="48" width="14" height="11" rx="3.5" fill="#60a5fa" fill-opacity="0.35"/>

  <!-- Row 2 -->
  <rect x="31" y="67" width="14" height="11" rx="3.5" fill="#38bdf8" fill-opacity="0.35"/>
  <rect x="53" y="67" width="14" height="11" rx="3.5" fill="#34d399" fill-opacity="0.35"/>

  <!-- Green Checkmark Circle Badge -->
  <circle cx="83" cy="77" r="18" fill="url(#checkGrad)" stroke="#0b0f19" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Checkmark Symbol -->
  <path d="M76 77.5 L81 82.5 L90 72.5" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
